name: Verify Můj kmen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP and SQLite
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - name: JavaScript syntax and model tests
        run: |
          node --check assets/app.js
          node --check support.js
          node --check support-payment.js
          node --check vendor/qrcodegen.js
          node --check privacy.js
          php -l legal.php
          npm test
          node --test support.test.mjs privacy-notice.test.mjs
      - name: PHP integration tests
        run: python3 tests/api_test.py
